name: Update market data

on:
  schedule:
    # 6:00 am and 6:00 pm Eastern, Monday to Friday.
    # GitHub schedules in UTC, and the UTC time shifts by an hour when the clocks
    # change, so both possibilities are listed. The first step below checks the
    # real Toronto time and skips the wrong one, so nothing needs changing in November.
    - cron: "0 10 * * 1-5"   # 6 am during daylight time
    - cron: "0 11 * * 1-5"   # 6 am during standard time
    - cron: "0 22 * * 1-5"   # 6 pm during daylight time
    - cron: "0 23 * * 1-5"   # 6 pm during standard time
  workflow_dispatch: # the "Run workflow" button, and the page's Refresh now button

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check it is 6 am or 6 pm Eastern (or a manual run)
        id: gate
        run: |
          HOUR=$(TZ=America/Toronto date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "06" ] || [ "$HOUR" = "18" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Toronto hour is $HOUR, not 06 or 18 - skipping this run."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Install yfinance
        if: steps.gate.outputs.go == 'true'
        run: pip install yfinance
      - name: Fetch prices and news
        if: steps.gate.outputs.go == 'true'
        run: python fetch_data.py
      - name: Commit updated data
        if: steps.gate.outputs.go == 'true'
        env:
          BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          # Always put the fresh data.json on top of the newest version of the repo.
          # (The old "pull --rebase" could hit a merge conflict if the repo had moved on,
          # for example when an old run is re-run with "Re-run jobs".)
          git config user.name "market-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          cp data.json "$RUNNER_TEMP/data.json"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/data.json" data.json
            git add data.json
            if git diff --staged --quiet; then
              echo "No change to save."
              exit 0
            fi
            git commit -m "Update data"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push failed (attempt $attempt of 3). Trying again..."
            sleep 3
          done
          echo "Could not save data.json after 3 attempts."
          exit 1
